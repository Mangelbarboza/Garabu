// Use the already installed API 36 for Android library compilation.
allprojects {
    plugins.withId('com.android.library') {
        androidComponents.finalizeDsl { libraryDsl ->
            libraryDsl.compileSdk = 36
            libraryDsl.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                '-DCMAKE_JOB_POOLS=compile_pool=2;link_pool=1',
                '-DCMAKE_JOB_POOL_COMPILE=compile_pool',
                '-DCMAKE_JOB_POOL_LINK=link_pool'
            ])
        }
    }
    plugins.withId('com.android.application') {
        androidComponents.finalizeDsl { appDsl ->
            appDsl.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                '-DCMAKE_JOB_POOLS=compile_pool=2;link_pool=1',
                '-DCMAKE_JOB_POOL_COMPILE=compile_pool',
                '-DCMAKE_JOB_POOL_LINK=link_pool'
            ])
        }
    }
}
